[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "cf-robot"
version = "0.1.0"
description = "SO-ARM101 teleoperation through Cloudflare Tunnel"
requires-python = ">=3.12,<3.14"
dependencies = [
  "lerobot==0.6.1",
  # Raspberry Pi CPU wheels: fail resolution rather than pulling CUDA builds.
  "torch==2.7.1+cpu; sys_platform == 'linux' and platform_machine == 'aarch64'",
  "torchvision==0.22.1; sys_platform == 'linux' and platform_machine == 'aarch64'",
  "websockets>=14,<17",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "opencv-python-headless>=4.8,<5",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
cf-robot-follower = "cf_robot.follower:main"
cf-robot-leader = "cf_robot.leader:main"
cf-robot-web = "cf_robot.web:main"
cf-robot-parking-record = "cf_robot.parking_client:record_main"
cf-robot-parking-set = "cf_robot.parking_client:set_main"
cf-robot-update = "cf_robot.update_client:main"
cf-robot-system = "cf_robot.system_client:main"
cf-robot-follower-calibrate = "cf_robot.calibration_client:main"
cf-robot-follower-limits = "cf_robot.servo_client:limits_main"
cf-robot-follower-home = "cf_robot.servo_client:home_main"
cf-robot-pose-compare = "cf_robot.pose_compare_client:main"
cf-robot-leader-limits = "cf_robot.leader_limits:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cf_robot = ["operator/*.html", "operator/*.js", "operator/*.css"]
